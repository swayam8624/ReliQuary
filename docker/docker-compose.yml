services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reliquary
      POSTGRES_USER: reliquary
      POSTGRES_PASSWORD: reliquary-dev-password
    volumes:
      - reliquary-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliquary -d reliquary"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile.platform
    ports:
      - "8000:8000"
    environment:
      RELIQUARY_ENV: development
      RELIQUARY_STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://reliquary:reliquary-dev-password@postgres:5432/reliquary
    volumes:
      - reliquary-data:/tmp/vaults
    depends_on:
      postgres:
        condition: service_healthy

  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  reliquary-data:
  reliquary-postgres:
